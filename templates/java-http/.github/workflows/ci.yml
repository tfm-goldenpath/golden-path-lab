name: Java consumer tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: consumer
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Detect opt-in and resolve exact engine pin
        id: quality
        working-directory: consumer
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const {engine} = JSON.parse(fs.readFileSync('golden-path.json'));
          if (engine?.repository !== 'https://github.com/tfm-goldenpath/golden-path-lab' || !/^[a-f0-9]{40}$/.test(engine.commit)) throw new Error('Expected exact engine identity');
          console.log('commit=' + engine.commit);
          NODE
          if [[ -e service/quality-gate.json || -L service/quality-gate.json ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Java quality gate: NOT_EXECUTED (not configured); ordinary tests follow.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tfm-goldenpath/golden-path-lab
          ref: ${{ steps.quality.outputs.commit }}
          path: engine
          persist-credentials: false
      - name: Ordinary tests without coverage acceptance
        if: steps.quality.outputs.enabled == 'false'
        working-directory: consumer
        run: |
          python3 "$GITHUB_WORKSPACE/engine/src/java-tests.py" "$GITHUB_WORKSPACE/consumer/service" "$RUNNER_TEMP/java-ordinary"
      - name: Java quality gate
        if: steps.quality.outputs.enabled == 'true'
        run: bash "$GITHUB_WORKSPACE/engine/bin/deliver" quality --consumer "$GITHUB_WORKSPACE/consumer" --output "$RUNNER_TEMP/java-quality"
      - name: Quality summary and evidence integrity
        if: always() && steps.quality.outputs.enabled == 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/java-quality/summary.txt" && ! -L "$RUNNER_TEMP/java-quality/summary.txt" ]]; then
            cat "$RUNNER_TEMP/java-quality/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Java quality gate: ERROR (missing summary; inspect job log).' >> "$GITHUB_STEP_SUMMARY"
          fi
          bash "$GITHUB_WORKSPACE/engine/bin/deliver" quality --verify "$RUNNER_TEMP/java-quality"
      - name: Retain quality evidence even on rejection
        if: always() && steps.quality.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: java-quality-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: ${{ runner.temp }}/java-quality/**
          if-no-files-found: error
          retention-days: 14
      - name: Retain ordinary test evidence
        if: always() && steps.quality.outputs.enabled == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: java-ordinary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/java-ordinary/**
          if-no-files-found: error
          retention-days: 14
