version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/implementacion/tooling"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    versioning-strategy: "increase"
    groups:
      schema-validation:
        applies-to: "version-updates"
        patterns:
          - "ajv"
          - "ajv-formats"
          - "ajv-formats-draft2019"
        update-types:
          - "minor"
          - "patch"
