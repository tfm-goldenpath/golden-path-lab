name: Publish verified recorded demo

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out reviewed publication tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download pinned transport and verify before extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 implementacion/scripts/defense-demo/pages.py fetch "$RUNNER_TEMP/demo-download"
          python3 implementacion/scripts/defense-demo/pages.py unpack "$RUNNER_TEMP/demo-download/demo-site-v1.tar.gz" "$RUNNER_TEMP/demo-site"
      - name: Upload only the verified static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/demo-site
          include-hidden-files: false
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
