name: Publish verified recorded demo

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out reviewed publication tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download pinned transport and verify before extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 implementacion/scripts/defense-demo/pages.py fetch "$RUNNER_TEMP/demo-download"
          python3 implementacion/scripts/defense-demo/pages.py unpack "$RUNNER_TEMP/demo-download/demo-site-v1.tar.gz" "$RUNNER_TEMP/demo-site"
      - name: Upload only the verified static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/demo-site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
