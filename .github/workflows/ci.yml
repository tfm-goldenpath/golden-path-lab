name: Golden Path tests

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: implementacion
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read the pinned Node version
        id: versions
        run: |
          source versions.env
          printf 'node=%s\n' "$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install tools with checksum verification
        run: |
          npm ci --prefix tooling --ignore-scripts --no-audit --no-fund
          PREFIX="$HOME/.local" bash scripts/install-security-tools.sh
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run service, policy and static workflow scenarios
        run: |
          python3 scripts/check-tool-versions.py
          make test WORKFLOW_EVIDENCE=evidence/raw/workflow-ci
      - name: Retain static workflow scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: implementacion/evidence/raw/workflow-ci/**
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
