name: Golden Path tests

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: implementation
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read the pinned Node version
        id: versions
        run: |
          source versions.env
          printf 'node=%s\n' "$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          # Keep cache effects out of privileged delivery and paired timings.
          package-manager-cache: false
      - name: Install tools with checksum verification
        run: |
          npm ci --prefix tooling --ignore-scripts --no-audit --no-fund
          PREFIX="$HOME/.local" bash scripts/install-security-tools.sh
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run service, policy and static workflow scenarios
        run: |
          python3 scripts/check-tool-versions.py
          make test WORKFLOW_EVIDENCE=evidence/raw/workflow-ci
      - name: Prepare harmless Pages packaging smoke
        run: |
          python3 tests/integration/actions-artifact-smoke.py prepare "$RUNNER_TEMP/actions-artifact-smoke" \
            --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Exercise Pages packaging without deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pages-packaging-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actions-artifact-smoke/site
          retention-days: 1
          include-hidden-files: false
      - name: Retain static workflow scenario evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: implementation/evidence/raw/workflow-ci/**
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
