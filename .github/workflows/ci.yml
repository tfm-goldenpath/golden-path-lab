name: Golden Path tests

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: implementacion
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read the pinned Node version
        id: versions
        run: |
          source versions.env
          printf 'node=%s\n' "$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install tools with checksum verification
        run: |
          PREFIX="$HOME/.local" bash scripts/install-security-tools.sh
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run service and policy tests
        run: |
          python3 scripts/check-tool-versions.py
          make test
